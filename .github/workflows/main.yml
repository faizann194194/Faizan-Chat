
name: Build Faizan Chat APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/main.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          unzip -o FaizanChat_Mobile_Project.zip -d .
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FaizanChat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
